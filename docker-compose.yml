version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: coffee_pos_db
    restart: always
    environment:
      POSTGRES_USER: coffee_admin
      POSTGRES_PASSWORD: coffee_secret_password
      POSTGRES_DB: coffee_pos_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coffee_admin -d coffee_pos_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: coffee_pos_api
    restart: always
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://coffee_admin:coffee_secret_password@postgres:5432/coffee_pos_db?schema=public
      JWT_SECRET: super_secret_coffee_jwt_key_2026
      JWT_REFRESH_SECRET: super_secret_coffee_refresh_key_2026
    depends_on:
      postgres:
        condition: service_healthy

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: coffee_pos_web
    restart: always
    ports:
      - "80:80"
    depends_on:
      - server

volumes:
  postgres_data:
